<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scott Forbes - Infinite Canvas</title>
    
    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            overflow: hidden;
        }

        /* Password Gate Styles */
        #password-gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease-in-out;
        }

        #password-gate.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .password-content {
            text-align: center;
            max-width: 400px;
            padding: 2rem;
        }

        .password-content h1 {
            font-size: 2.5rem;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            margin-bottom: 2rem;
            letter-spacing: 3px;
        }

        #password-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 8px;
            color: #00ffff;
            text-align: center;
            margin-bottom: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        #password-input:focus {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        #password-input.error {
            border-color: #ff0066;
            box-shadow: 0 0 20px rgba(255, 0, 102, 0.5);
        }

        #enter-button {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #00ffff, #0099ff);
            border: none;
            border-radius: 8px;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #enter-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
        }

        #password-error {
            color: #ff0066;
            margin-top: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #password-error.visible {
            opacity: 1;
        }

        /* Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        #canvas-container.active {
            display: block;
        }

        /* Navigation Menu */
        #nav-menu {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffff;
            border-radius: 12px;
            padding: 1rem;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            padding: 0.8rem 1.5rem;
            margin: 0.5rem 0;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            border-radius: 8px;
            color: #00ffff;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-item:hover {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            transform: translateX(-5px);
        }

        /* Canvas Node Styles */
        .canvas-node {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ffff;
            border-radius: 16px;
            padding: 2rem;
            min-width: 300px;
            max-width: 500px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
            pointer-events: auto;
        }

        .node-title {
            font-size: 2rem;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 1rem;
            text-align: center;
        }

        .node-subtitle {
            font-size: 1.2rem;
            color: #66ffff;
            text-align: center;
            margin-bottom: 1rem;
        }

        .node-content {
            color: #ffffff;
            line-height: 1.6;
            font-size: 1rem;
        }

        .node-content h3 {
            color: #00ffff;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .fact-section {
            margin: 1rem 0;
            padding: 1rem;
            background: rgba(0, 255, 255, 0.05);
            border-radius: 8px;
        }

        .countries-list {
            color: #cccccc;
            font-size: 0.9rem;
            line-height: 1.8;
        }

        /* Loading indicator */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 1.5rem;
            text-shadow: 0 0 20px #00ffff;
        }

        /* Glow animations */
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; }
            50% { text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff; }
        }

        .glow-text {
            animation: glow 2s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <!-- Password Gate -->
    <div id="password-gate">
        <div class="password-content">
            <h1 class="glow-text">ENTER</h1>
            <input type="password" id="password-input" placeholder="Password" autofocus>
            <button id="enter-button">Access</button>
            <p id="password-error">Access Denied</p>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Navigation Menu -->
    <div id="nav-menu" style="display: none;">
        <div class="nav-item" data-target="center">Home</div>
        <div class="nav-item" data-target="work">Work</div>
        <div class="nav-item" data-target="about">About</div>
        <div class="nav-item" data-target="writing">Writing</div>
        <div class="nav-item" data-target="contact">Contact</div>
    </div>

    <!-- Security Configuration -->
    <script src="config.js"></script>
    <script src="security.js"></script>
    <script src="data.js"></script>
    <script src="canvas.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Get configuration from secure config
        const appToken = window._AppConfig ? window._AppConfig.init() : null;
        const PASSWORD = window._AppConfig ? window._AppConfig.getAuth(appToken) : 'default';
        
        const passwordGate = document.getElementById('password-gate');
        const canvasContainer = document.getElementById('canvas-container');
        const navMenu = document.getElementById('nav-menu');
        const passwordInput = document.getElementById('password-input');
        const enterButton = document.getElementById('enter-button');
        const passwordError = document.getElementById('password-error');
        
        const checkPassword = () => {
            if (passwordInput.value === PASSWORD) {
                // Authenticate with secure data module
                if (window._SecureData && window._SecureData.authenticate('authenticated_user_verified')) {
                    // Fade out password gate
                    passwordGate.classList.add('fade-out');
                    
                    setTimeout(() => {
                        passwordGate.style.display = 'none';
                        canvasContainer.classList.add('active');
                        navMenu.style.display = 'block';
                        
                        // Initialize the canvas
                        initCanvas();
                    }, 500);
                } else {
                    console.error('Security module authentication failed');
                    passwordError.textContent = 'Security Error';
                    passwordError.classList.add('visible');
                    setTimeout(() => {
                        passwordError.classList.remove('visible');
                        passwordError.textContent = 'Access Denied';
                    }, 2000);
                }
            } else {
                passwordError.classList.add('visible');
                passwordInput.classList.add('error');
                setTimeout(() => {
                    passwordError.classList.remove('visible');
                    passwordInput.classList.remove('error');
                }, 1000);
                passwordInput.value = "";
            }
        };
        
        enterButton.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') checkPassword(); 
        });
    });
    </script>
</body>
</html>
