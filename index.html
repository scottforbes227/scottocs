<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scott Forbes - Infinite Canvas</title>
    
    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fcfcfc;
            color: #1a1a1a;
            overflow: hidden;
        }

        /* Password Gate Styles */
        #password-gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fcfcfc;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.4s ease-out;
        }

        #password-gate.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .password-content {
            text-align: center;
            max-width: 360px;
            padding: 2rem;
        }

        .password-content h1 {
            font-family: 'Lora', Georgia, serif;
            font-size: 2.25rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
        }

        #password-input {
            width: 100%;
            padding: 0.875rem 1rem;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            border: 1px solid #d4d4d4;
            border-radius: 4px;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        #password-input:focus {
            border-color: #2962ff;
            box-shadow: 0 0 0 3px rgba(41, 98, 255, 0.1);
        }

        #password-input.error {
            border-color: #eb5757;
            box-shadow: 0 0 0 3px rgba(235, 87, 87, 0.1);
        }

        #enter-button {
            width: 100%;
            padding: 0.875rem 1rem;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            background: #1a1a1a;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #enter-button:hover {
            background: #2962ff;
        }

        #enter-button:active {
            transform: scale(0.98);
        }

        #password-error {
            color: #eb5757;
            font-size: 0.875rem;
            margin-top: 1rem;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #password-error.visible {
            opacity: 1;
        }

        /* Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        #canvas-container.active {
            display: block;
        }

        /* Navigation Menu */
        #nav-menu {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 0.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .nav-item {
            padding: 0.625rem 1rem;
            margin: 0.25rem 0;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .nav-item:hover {
            background: #f5f5f5;
            color: #2962ff;
        }

        .nav-item:active {
            transform: scale(0.98);
        }

        /* Canvas Node Styles */
        .canvas-node {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 2rem;
            min-width: 320px;
            max-width: 480px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            pointer-events: auto;
        }

        .node-title {
            font-family: 'Lora', Georgia, serif;
            font-size: 2rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .node-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            color: #666666;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .node-content {
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            line-height: 1.6;
            font-size: 0.9375rem;
        }

        .node-content h3 {
            font-family: 'Lora', Georgia, serif;
            font-size: 1.125rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        .fact-section {
            margin: 1rem 0;
            padding: 1rem;
            background: #f9f9f9;
            border-left: 2px solid #2962ff;
            border-radius: 4px;
        }

        .countries-list {
            color: #666666;
            font-size: 0.875rem;
            line-height: 1.7;
        }

        /* Loading indicator */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #1a1a1a;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- Password Gate -->
    <div id="password-gate">
        <div class="password-content">
            <h1>Enter</h1>
            <input type="password" id="password-input" placeholder="Password" autofocus>
            <button id="enter-button">Access</button>
            <p id="password-error">Access Denied</p>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Navigation Menu -->
    <div id="nav-menu" style="display: none;">
        <div class="nav-item" data-target="center">Home</div>
        <div class="nav-item" data-target="work">Work</div>
        <div class="nav-item" data-target="about">About</div>
        <div class="nav-item" data-target="writing">Writing</div>
        <div class="nav-item" data-target="contact">Contact</div>
    </div>

    <!-- Security Configuration -->
    <script src="config.js"></script>
    <script src="security.js"></script>
    <script src="data.js"></script>
    <script src="canvas.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Get configuration from secure config
        const appToken = window._AppConfig ? window._AppConfig.init() : null;
        const PASSWORD = window._AppConfig ? window._AppConfig.getAuth(appToken) : 'default';
        
        const passwordGate = document.getElementById('password-gate');
        const canvasContainer = document.getElementById('canvas-container');
        const navMenu = document.getElementById('nav-menu');
        const passwordInput = document.getElementById('password-input');
        const enterButton = document.getElementById('enter-button');
        const passwordError = document.getElementById('password-error');
        
        const checkPassword = () => {
            if (passwordInput.value === PASSWORD) {
                // Authenticate with secure data module
                if (window._SecureData && window._SecureData.authenticate('authenticated_user_verified')) {
                    // Fade out password gate
                    passwordGate.classList.add('fade-out');
                    
                    setTimeout(() => {
                        passwordGate.style.display = 'none';
                        canvasContainer.classList.add('active');
                        navMenu.style.display = 'block';
                        
                        // Initialize the canvas
                        initCanvas();
                    }, 500);
                } else {
                    console.error('Security module authentication failed');
                    passwordError.textContent = 'Security Error';
                    passwordError.classList.add('visible');
                    setTimeout(() => {
                        passwordError.classList.remove('visible');
                        passwordError.textContent = 'Access Denied';
                    }, 2000);
                }
            } else {
                passwordError.classList.add('visible');
                passwordInput.classList.add('error');
                setTimeout(() => {
                    passwordError.classList.remove('visible');
                    passwordInput.classList.remove('error');
                }, 1000);
                passwordInput.value = "";
            }
        };
        
        enterButton.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') checkPassword(); 
        });
    });
    </script>
</body>
</html>
