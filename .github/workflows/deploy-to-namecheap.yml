name: Deploy to Namecheap via FTP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build if Node project
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm ci
          npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.NAMECHEAP_FTP_HOST || secrets.FTP_HOST || secrets.FTP_SERVER }}
          username: ${{ secrets.NAMECHEAP_FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.NAMECHEAP_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: /public_html/
          port: 21
